name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Detect repo name (for project-pages basePath)
        id: repo
        run: |
          NAME=${GITHUB_REPOSITORY##*/}
          if [[ "$NAME" == *.github.io ]]; then
            echo "basePath=" >> $GITHUB_OUTPUT
          else
            echo "basePath=/$NAME" >> $GITHUB_OUTPUT
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - run: npm ci

      - name: Build
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.repo.outputs.basePath }}
          # Discord 通知 webhook 只存在仓库 Secret 里，构建时注入。
          # 没设这个 Secret 时为空字符串，站点静默不发通知。
          NEXT_PUBLIC_DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: npm run build

      - name: Add .nojekyll
        run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
